# Local hooks only: no network fetch, and every hook runs the same binary the
# project already pins. `pre-commit autoupdate` has nothing to drift against.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: redline-scan
        name: red-line scan
        entry: uv run python scripts/redline_scan.py
        language: system
        pass_filenames: true
        always_run: true
