[project]
name = "ticket-to-record"
version = "0.1.0"
description = "Turn free-text service tickets into structured records: extraction pipeline, retrieval, and an evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.15",
    "rich>=13.9",
    "google-genai>=1.0",
]

[project.scripts]
ttr = "ticket_to_record.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_to_record"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src:scripts"

# The vendor SDK does not ship complete stubs; keep our own code strict.
[[tool.mypy.overrides]]
module = "google.genai.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
